<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Hope Health</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header class="main-header">
            <div class="logo-container">
                <img src="kevin.png" alt="Logo" class="logo">
                <h1>HOPE HEALTH CENTER</h1>
            </div>
        </header>


      <div class="main-layout">
    <aside class="sidebar">
        <h3>Menu</h3>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="registration.html">Patient</a></li>
            <li><a href="appointment.html">Appointment</a></li>
            <li><a href="report.html">Reports</a></li>
            <li><a href="setting.html">Settings</a></li>
        </ul>
    </aside>

    <main class="content-area">
                <div class="settings-card">
                    <h2>Configuration Panel</h2>
                    
                    <div class="settings-grid">
                        <div class="full-row">
                            <label>Click name:</label>
                            <input type="text" value="Hope Health Center">
                        </div>

                        <div class="setting-item">
                            <label>Language:</label>
                            <select>
                                <option>English</option>
                                <option>Kinyarwanda</option>
                                <option>French</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>Printer:</label>
                            <select>
                                <option>Default Printer</option>
                                <option>HP LaserJet 400</option>
                            </select>
                        </div>

                        <div class="setting-item">
                            <label>Auto Backup:</label>
                            <select>
                                <option>Enable</option>
                                <option>Disable</option>
                            </select>
                        </div>
                        <div class="setting-item">
                            <label>Offline Mode:</label>
                            <select>
                                <option>Active</option>
                                <option>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="blue-btn"></button>
                        <button class="blue-btn"></button>
                        <button class="blue-btn"></button>
                    </div>
                </div>

                <div class="settings-footer">
                    System Ready > Offline System
                </div>
            </main>
        </div>
    </div>
</body>
</html>
