<body>

    <nav>
        <button><a href="index.html">HOME</a></button> &nbsp;

    </nav>

    <main class="container">
        <div class="history-card">
            <h2>Conversion History</h2>
            
            <div class="history-actions">
                <button id="clear-history" class="btn-clear" onclick="clearHistory()">
                    <i class="fas fa-trash"></i> Clear History
                </button>
            </div>

            <div class="table-responsive">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Entry Details</th>
                        </tr>
                    </thead>
                    <tbody id="history-list">
                        </tbody>
                </table>
            </div>
        </div>

     <footer class="footer">

            <div class="footer-section">
                <h4>Quick Links</h4>

                    <li><a href="index.html">Home</a></li>

    <script>
        /* =============================
           LOAD HISTORY FUNCTION
        ============================= */
        function loadHistory() {
            const historyList = document.getElementById("history-list");
            // Fata amakuru muri localStorage
            let history = JSON.parse(localStorage.getItem("history")) || [];

            if (history.length === 0) {
                historyList.innerHTML = "<tr><td colspan='2' style='text-align:center;'>No history found.</td></tr>";
                return;
            }

            // Kwerekana buri kintu cyabitswe (Date na Details)
            historyList.innerHTML = history.reverse().map(item => `
                <tr>
                    <td>${item.date || "N/A"}</td>
                    <td>${item.details || item}</td>
                </tr>
            `).join("");
        }

        /* =============================
           CLEAR HISTORY FUNCTION
        ============================= */
        function clearHistory() {
            if (confirm("Are you sure you want to delete all history?")) {
                localStorage.removeItem("history");
                loadHistory(); // Refresh table
            }
        }

        // Hamagara iyi function paji ikimara gufunguka
        window.onload = loadHistory;
    </script>
</body>
