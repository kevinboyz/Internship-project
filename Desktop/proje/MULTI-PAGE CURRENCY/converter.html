  <style>
    .converter-box {
      max-width: 400px;
      margin: auto;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background-color: #444; /* Kugira ngo ise neza nka ya yindi wanyeretse */
      color: white;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      text-align: left;
    }

    nav {
      background-color: black;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: yellow;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
    }

    .swap-btn {
      background: lightcoral;
      color: white;
      border: 1px solid black;
      cursor: pointer;
    }

    .convert-btn {
      background: blue;
      color: lawngreen;
      border: 1px solid black;
      cursor: pointer;
    }

    .loading {
      display: none;
      text-align: center;
    }
    
  </style>
</head>

<body>

<nav>
  <a href="index.html">Home</a> 
  <a href="converter.html">Converter</a> 
  <a href="history.html">History</a>
  <a href="settings.html">Settings</a>
</nav>

<div class="converter-box" style="margin-top: 50px;">
  
  <h2>Currency Converter</h2>

  <input type="number" id="amount" placeholder="Enter amount">

  <label>From:</label>
  <select id="from">
    <option value="USD">🇺🇸 USD</option>
    <option value="EUR">🇪🇺 EUR</option>
    <option value="GBP">🇬🇧 GBP</option>
    <option value="RWF">🇷🇼 RWF</option>
  </select>

  <button class="swap-btn" onclick="swapCurrencies()">⇄ Swap</button>

  <label>To:</label>
  <select id="to">
    <option value="RWF">🇷🇼 RWF</option>
    <option value="USD">🇺🇸 USD</option>
    <option value="EUR">🇪🇺 EUR</option>
    <option value="GBP">🇬🇧 GBP</option>
  </select>

  <button class="convert-btn" onclick="convert()">Convert</button>

  <div class="loading" id="loading">⏳ Converting...</div>

  <h3 id="result" style="text-align: center; margin-top: 20px;"></h3>
</div>
 <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h4>BG-TECH Currency</h4>
                <p>Providing reliable exchange rates and financial tools for L3 SOD students.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="converter.html">Converter</a></li>
                    <li><a href="settings.html">Theme Settings</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Follow Us</h4>
                <div class="social-links">
                   <a href="https://www.instagram.com/accounts/login/" target="_blank">

                    <i class="fab fa-facebook"></i>
                    </a>

                    </a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 CURRENCY APP Designed for Integrated Task L3 SOD

<script>
/* =============================
   EXCHANGE RATES (STATIC)
============================= */
const rates = {
  USD: 1,
  EUR: 0.92,
  GBP: 0.78,
  RWF: 1300
};

/* =============================
   CONVERT FUNCTION
============================= */
function convert() {
  const amount = document.getElementById("amount").value;
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;
  const resultText = document.getElementById("result");
  const loader = document.getElementById("loading");

  if (!amount || amount <= 0) {
    alert("Please enter a valid positive amount");
    return;
  }

  loader.style.display = "block";
  resultText.innerText = "";

  setTimeout(() => {
    const result = (amount / rates[from]) * rates[to];
    const timestamp = new Date().toLocaleString();
    const entryText = `${amount} ${from} → ${result.toFixed(2)} ${to}`;

    resultText.innerText = entryText;
    loader.style.display = "none";

    // Kubika muri History hamwe n'igihe
    saveHistory({
        date: timestamp,
        details: entryText
    });
  }, 800);
}

/* =============================
   SWAP FUNCTION
============================= */
function swapCurrencies() {
  const from = document.getElementById("from");
  const to = document.getElementById("to");

  let temp = from.value;
  from.value = to.value;
  to.value = temp;
}

/* =============================
   SAVE HISTORY
============================= */
function saveHistory(entry) {
  let history = JSON.parse(localStorage.getItem("history")) || [];
  history.push(entry);
  localStorage.setItem("history", JSON.stringify(history));
}

</script>

</body>
